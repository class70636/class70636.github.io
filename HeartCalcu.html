<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心力計算器</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&display=swap" rel="stylesheet">
    <style>
        .lxgw-wenkai-tc-regular {
            font-family: "LXGW WenKai TC", cursive;
            font-weight: 400;
            font-style: normal;
        }

        .video-container {
            position: relative;
            height: 100vh;
            /* 全螢幕高度，可自行調整 */
            overflow: hidden;
            /* 關鍵：裁切影片，不產生滾動條 */
        }

        /* 影片本身 */
        .bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* 重點：等比例裁切 */
            transform: translate(-50%, -50%);
            z-index: 1;
        }

        /* 前景內容 */
        .video-container .container {
            position: relative;
            z-index: 2;
        }

        .container {
            top: -30%;
            background-color: rgba(255, 255, 255, 0.25);
            border-radius: 15px;
        }

    </style>
</head>

<body>
    <div class="video-container container-fluid d-flex justify-content-center align-items-center">

        <video src="https://yysls-build-na.fp.ps.easebar.com/file/6909676a8e8ca9de2eb191dcrzdPj9Pe03" class="bg-video"
            loop="" muted="" autoplay="" preload=""></video>

        <div class="container border shadow border-secondary">
            <div class="row mt-3">
                <div class="col">
                    <div class="input-group mt-1 mb-1">
                        <span class="input-group-text fs-2 lxgw-wenkai-tc-regular" id="current-heart">目前心力</span>
                        <input type="text" class="form-control fs-2 lxgw-wenkai-tc-regular"
                            aria-label="Sizing example input" aria-describedby="current-heart" id="currentHeart">
                    </div>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-xl-6 col-sm-12">
                    <div class="input-group mt-1 mb-3">
                        <span class="input-group-text fs-2 lxgw-wenkai-tc-regular" id="target-heart">目標心力</span>
                        <input type="text" class="form-control fs-2 lxgw-wenkai-tc-regular"
                            aria-label="Sizing example input" aria-describedby="target-heart" id="targetHeart"
                            value="490">
                    </div>
                </div>
                <div class="col-xl-6 col-sm-12">
                    <div class="input-group mt-1 mb-3">
                        <span class="input-group-text fs-2 lxgw-wenkai-tc-regular" id="date-picker">目標時間</span>
                        <input type="datetime-local" class="form-control fs-2 lxgw-wenkai-tc-regular"
                            aria-label="Sizing example input" aria-describedby="date-picker" id="datePicker">
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col mt-1 mb-3">
                    <div class="d-grid gap-2">
                        <button class="btn btn-primary lxgw-wenkai-tc-regular btn-lg fs-2" type="button">計算</button>
                    </div>
                </div>
                <div class="col mt-1 mb-3">
                    <div class="d-grid gap-2">
                        <button class="btn btn-danger lxgw-wenkai-tc-regular btn-lg fs-2" type="button">重置</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        // JavaScript code can be added here for button functionality
        document.addEventListener('DOMContentLoaded', function () {
            const calculateButton = document.querySelector('.btn-primary');
            const resetButton = document.querySelector('.btn-danger');

            calculateButton.addEventListener('click', function () {

                if (!check()) {
                    alert('我不是麻倉葉餒，請至少填兩個欄位');
                    return;
                }
                const currentHeart = parseFloat(document.getElementById('currentHeart').value);
                const targetHeart = parseFloat(document.getElementById('targetHeart').value);
                const datePicker = document.getElementById('datePicker').value;
                const now = new Date();

                if (currentHeart && targetHeart && !datePicker) {
                    //計算需要時間
                    const diff = targetHeart - currentHeart;
                    const diffTime = diff * 9; //分鐘
                    const day_list = ['日', '一', '二', '三', '四', '五', '六'];
                    const targetDate = new Date(now.getTime() + diffTime * 60000);
                    const targetDay = day_list[targetDate.getDay()];
                    alert(`到達目標心力 ${targetHeart} 需要 ${diffTime} 分鐘，到達時間為 ${targetDate.toLocaleString()} (${targetDay})`);
                } else if (currentHeart && !targetHeart && datePicker) {
                    const targetDate = new Date(datePicker);
                    const timeDiff = targetDate - now;
                    const diffMinutes = Math.ceil(timeDiff / (1000 * 60));
                    const neededHeart = Math.ceil(diffMinutes / 9);
                    const totalHeart = neededHeart + currentHeart;
                    const warning = totalHeart > 500 ? '，爆體囉' : '';
                    alert(`到達目標時間擁有 ${totalHeart} 心力${warning}`);
                } else if (!currentHeart && targetHeart && datePicker) {
                    const targetDate = new Date(datePicker);
                    const timeDiff = targetDate - now;
                    const diffMinutes = Math.ceil(timeDiff / (1000 * 60));
                    const neededHeart = Math.ceil(diffMinutes / 9);
                    const currentHeartNeeded = targetHeart - neededHeart;
                    const msg = currentHeartNeeded < 0 ? '心力充足無虞' : '需要目前擁有 ' + currentHeartNeeded + ' 心力';
                    alert(`${msg}`);
                } else if (currentHeart && targetHeart && datePicker) {
                    alert('全寫不知道要算甚麼😑');
                }

                function check() {
                    const inputs = [
                        document.getElementById('currentHeart').value.trim(),
                        document.getElementById('targetHeart').value.trim(),
                        document.getElementById('datePicker').value.trim()
                    ];

                    // 計算有填值的數量
                    const filledCount = inputs.filter(v => v !== '').length;

                    if (filledCount >= 2)
                        return true;
                    return false;
                }

            });

            resetButton.addEventListener('click', function () {
                document.getElementById('currentHeart').value = '';
                document.getElementById('targetHeart').value = '490';
                document.getElementById('datePicker').value = '';
            });
        });
    </script>
</body>

</html>
